<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="title">
    <span class="title-text">Меню</span>
    <button class="lang-switch" onclick="toggleLanguage()">🌐</button>
</header>

<div class="carousel-wrapper">
    <div class="carousel-container">
        
        <div class="carousel-slide active" style="background-image: url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200&q=80');">
            <div class="carousel-overlay"></div>
            <div class="carousel-content">
                <h2 data-lang-ru="☕ Новое меню завтраков!" data-lang-en="☕ New Breakfast Menu!">☕ Новое меню завтраков!</h2>
                <p data-lang-ru="Попробуйте наши свежие круассаны и ароматный кофе" data-lang-en="Try our fresh croissants and aromatic coffee">Попробуйте наши свежие круассаны и ароматный кофе</p>
            </div>
        </div>

        <div class="carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=1200&q=80');">
            <div class="carousel-overlay"></div>
            <div class="carousel-content">
                <h2 data-lang-ru="🎉 Скидка 20% на десерты" data-lang-en="🎉 20% Off on Desserts">🎉 Скидка 20% на десерты</h2>
                <p data-lang-ru="Только в эти выходные - сладкие предложения!" data-lang-en="This weekend only - sweet deals!">Только в эти выходные - сладкие предложения!</p>
            </div>
        </div>

        <div class="carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1511920170033-f8396924c348?w=1200&q=80');">
            <div class="carousel-overlay"></div>
            <div class="carousel-content">
                <h2 data-lang-ru="🔥 Фирменный латте" data-lang-en="🔥 Signature Latte">🔥 Фирменный латте</h2>
                <p data-lang-ru="Наш бестселлер - идеальное начало дня" data-lang-en="Our bestseller - perfect start of the day">Наш бестселлер - идеальное начало дня</p>
            </div>
        </div>

        <div class="carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1524351199678-941a58a3df50?w=1200&q=80');">
            <div class="carousel-overlay"></div>
            <div class="carousel-content">
                <h2 data-lang-ru="🍰 Новинка: Чизкейк" data-lang-en="🍰 New: Cheesecake">🍰 Новинка: Чизкейк</h2>
                <p data-lang-ru="Нежный десерт по авторскому рецепту" data-lang-en="Delicate dessert by author's recipe">Нежный десерт по авторскому рецепту</p>
            </div>
        </div>

    </div>

    <div class="carousel-dots">
        <span class="carousel-dot active"></span>
        <span class="carousel-dot"></span>
        <span class="carousel-dot"></span>
        <span class="carousel-dot"></span>
    </div>
</div>

<div class="container">
    <div class="category-list" id="categoryList"></div>
</div>

<div class="bonus-button-container">
    <button class="bonus-button" onclick="openGame()">
        <span class="bonus-icon">🎁</span>
        <span class="bonus-text" data-lang-ru="Получить бонусы" data-lang-en="Get Bonuses">Получить бонусы</span>
        <span class="bonus-arrow">→</span>
    </button>
</div>

<script>
function openGame() {
    window.location.href = 'game.html';
}

function updateBonusButtonText() {
    const lang = localStorage.getItem("lang") || "ru";
    const bonusText = document.querySelector('.bonus-text');
    if (bonusText) {
        bonusText.textContent = lang === "ru" 
            ? bonusText.getAttribute('data-lang-ru')
            : bonusText.getAttribute('data-lang-en');
    }
}

window.addEventListener('DOMContentLoaded', updateBonusButtonText);
</script>

<script src="js/language.js"></script>
<script src="js/menu.js"></script>
<script src="js/carousel.js"></script>
<script src="js/category-animations.js"></script>
</body>
</html>
